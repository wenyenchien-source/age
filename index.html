<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生肖・虛歲・歲次查詢</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap">
    <style>
        body { font-family: sans-serif; background-color: #f7f3ef; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .container { background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; border: 1px solid #e8e4de; }
        h1 { font-size: 1rem; color: #888; margin-bottom: 10px; font-weight: normal; }
        input { width: 100%; padding: 15px; font-size: 2rem; text-align: center; border: 2px solid #ccd6dc; border-radius: 12px; box-sizing: border-box; color: #2c3e50; font-weight: bold; }

        /* 國曆／農曆切換 */
        .cal-toggle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; margin-bottom: 10px; border: 2px solid #4a6777; border-radius: 12px; overflow: hidden; }
        .cal-toggle button { min-height: 48px; border: none; background: #fff; color: #4a6777; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .cal-toggle button.active { background: #4a6777; color: #fff; }

        /* 國曆模式的月、日 */
        .md-row { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .md-row.show { display: grid; }
        .md-row input { font-size: 1.5rem; padding: 10px; }
        .md-hint { font-size: 0.85rem; color: #888; margin-top: 6px; display: none; }
        .md-hint.show { display: block; }

        .result-area { margin: 15px 0; min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
        .zodiac { font-size: 3rem; font-weight: bold; color: #4a6777; }
        .age-list { font-size: 1.2rem; color: #333; font-weight: bold; }
        .note { font-size: 0.9rem; color: #a0522d; margin-top: 6px; }
        /* 生肖與歲次並排 */
        .zodiac-line { display: flex; justify-content: center; align-items: baseline; gap: 14px; }
        .suici { font-size: 1.6rem; font-weight: bold; }
        /* 點生肖：年紀｜出生年｜歲次 對照表 */
        .zodiac-cap { font-size: 1rem; letter-spacing: 3px; }
        .age-table { width: 100%; margin-top: 8px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
        .age-table th { padding: 0 6px 6px; font-size: 0.85rem; font-weight: 500; letter-spacing: 3px; }
        .age-table td { padding: 6px; line-height: 1.3; white-space: nowrap; }
        .age-table .c-age { text-align: right; padding-right: 18px; }
        .age-table .c-year { text-align: center; }
        .age-table .c-sui { text-align: left; padding-left: 18px; }
        .age-table .n { font-size: 1.5rem; font-weight: 900; }
        .age-table .yr { display: inline-block; min-width: 2.1em; text-align: right; font-size: 1.2rem; font-weight: 700; }
        .age-table .u { font-size: 0.85rem; margin: 0 2px; }
        .age-table .gz { font-size: 1.3rem; font-weight: 700; letter-spacing: 3px; }

        /* 歲次查詢：天干、地支點選 */
        .gz-pick { display: none; }
        .gz-pick.show { display: block; }
        .gz-row { display: grid; gap: 6px; margin-top: 6px; }
        .gz-row.gan { grid-template-columns: repeat(5, 1fr); }
        .gz-row.zhi { grid-template-columns: repeat(6, 1fr); }
        .gz-lab { font-size: 0.85rem; text-align: left; margin-top: 10px; letter-spacing: 3px; }
        .gz-btn { min-height: 48px; font-size: 1.3rem; cursor: pointer; padding: 0; }
        .gz-btn:disabled { cursor: default; }
        /* 歲次查詢結果：每一列兩行（大字＝牌位常見寫法，小字＝其他對照），虛歲靠右 */
        .gz-title { font-size: 2.2rem; font-weight: 900; }
        .gz-list { list-style: none; margin: 10px 0 0; padding: 0; text-align: left; }
        .gz-list li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 6px; }
        .gz-main { font-size: 1.25rem; font-weight: 700; }
        .gz-sub { font-size: 0.9rem; margin-top: 2px; }
        .gz-age { font-size: 1.4rem; font-weight: 900; white-space: nowrap; }
        .gz-age .u { font-size: 0.85rem; margin-left: 2px; }
        .gz-foot { font-size: 0.85rem; margin-top: 8px; }
        .gz-head { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
        .gz-redo, .gz-more { min-height: 48px; padding: 0 16px; font-size: 1rem; cursor: pointer; }
        .gz-more { width: 100%; margin-top: 8px; }
        .gz-old { display: none; }
        .gz-old.show { display: block; }
        .gz-old .gz-list { margin-top: 0; }
        .gz-old .gz-list li:first-child { border-top: none; }

        /* 縮小按鈕與間距，確保滿版不需滑動 */
        .zodiac-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .zodiac-btn { background: #fdfdfd; border: 1px solid #ccd6dc; padding: 12px 5px; border-radius: 8px; cursor: pointer; color: #555; font-size: 1.2rem; font-weight: bold; }

        .footer { margin-top: 15px; font-size: 0.8rem; color: #c0c0c0; letter-spacing: 1px; }
/* ===== 重生禮儀 和風配色（與「系統工具」一致；獨立網站無法引用系統的 shared/theme.css，所以複製一份在這裡） =====
 * 臙脂 --enji 主要按鈕與重點字；柿橘 --kaki 已選取、標記、輔助線；墨 --sumi 文字；和紙 --washi 底色 */
:root {
  --washi: #f7f4ef; --paper: #ffffff; --paper-2: #faf8f4;
  --line: #d9d2c7; --line-2: #e9e4dc; --line-strong: #c9c0b3;
  --sumi: #2a2623; --nezumi: #6b645e;
  --kaki: #a5512c; --kaki-soft: #f6ece5;
  --enji: #7e2f26; --enji-soft: #f6e9e6;
  --ok: #4a6741; --ok-soft: #ebf0e5; --warn: #875a17; --warn-soft: #f6eddb;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Heiti TC", sans-serif;
}
.lt-row { display: flex; align-items: center; gap: 12px; }
.lt-mark { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--kaki); color: var(--kaki); font-family: var(--serif); font-weight: 900; font-size: 22px; line-height: 1; }
.lt-brand { margin: 0 0 4px; font-family: var(--serif); font-size: 12px; letter-spacing: 6px; color: var(--kaki); line-height: 1; }
.lt-title { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: 3px; color: var(--sumi); line-height: 1.25; }
.lt-ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }

/* ── 本頁和風樣式（只改外觀） ── */
body { font-family: var(--sans); background-color: var(--washi); color: var(--sumi); }
.container { border-radius: 4px; box-shadow: none; border: 1px solid var(--line); }
.age-head { margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line-2); text-align: left; }
h1 { color: var(--nezumi); }
input { border: 1px solid var(--line-strong); border-radius: 3px; color: var(--sumi); }
input:focus { outline: none; border-color: var(--kaki); }
.cal-toggle { border: 1px solid var(--kaki); border-radius: 3px; }
.cal-toggle button { color: var(--kaki); font-family: var(--serif); }
.cal-toggle button.active { background: var(--kaki); color: #fff; font-weight: 900; }
.md-hint { color: var(--nezumi); }
.zodiac { font-family: var(--serif); font-weight: 900; color: var(--enji); }
.age-list { font-family: var(--serif); color: var(--sumi); font-weight: 700; }
.note { color: var(--kaki); }
.suici { font-family: var(--serif); color: var(--sumi); letter-spacing: 2px; }
.zodiac-cap { font-family: var(--serif); color: var(--nezumi); }
.age-table { font-family: var(--serif); color: var(--sumi); }
.age-table th { color: var(--kaki); border-bottom: 1px solid var(--kaki); }
.age-table td { border-bottom: 1px solid var(--line-2); }
.age-table tbody tr:nth-child(even) td { background: var(--paper-2); }
.age-table .u { color: var(--nezumi); }
.zodiac-grid { border-top-color: var(--line-2); }
.zodiac-btn { background: #fff; border-color: var(--line); border-radius: 3px; color: var(--sumi); font-family: var(--serif); font-weight: 900; }
.gz-lab { color: var(--kaki); font-family: var(--serif); }
.gz-btn { background: #fff; border: 1px solid var(--line); border-radius: 3px; color: var(--sumi); font-family: var(--serif); font-weight: 900; }
.gz-btn.on { background: var(--kaki); border-color: var(--kaki); color: #fff; }
.gz-btn:disabled { background: var(--paper-2); border-color: var(--line-2); color: #c9c0b3; }
.gz-title { font-family: var(--serif); color: var(--enji); letter-spacing: 3px; }
.gz-title .z { font-size: 1.1rem; color: var(--sumi); font-weight: 700; letter-spacing: 1px; }
.gz-list { font-family: var(--serif); color: var(--sumi); }
.gz-list li { border-bottom: 1px solid var(--line-2); }
.gz-list li:first-child { border-top: 1px solid var(--kaki); }
.gz-list li:nth-child(even) { background: var(--paper-2); }
.gz-sub, .gz-age .u, .gz-foot { color: var(--nezumi); }
.gz-sub { font-family: var(--sans); }
.gz-redo, .gz-more { background: #fff; border: 1px solid var(--kaki); border-radius: 3px; color: var(--kaki); font-family: var(--serif); font-weight: 700; }
.gz-redo:active, .gz-more:active { background: var(--kaki-soft); }
.zodiac-btn:active, .zodiac-btn.on { background: var(--kaki); border-color: var(--kaki); color: #fff; }
.footer { color: var(--nezumi); font-family: var(--serif); letter-spacing: 4px; }

/* ── 好讀調整（2026-10-22，只改外觀，不動計算） ── */
/* 虛歲是最常要看的答案，放大 */
.age-list { font-size: 1.9rem; margin-top: 4px; }
/* 表頭、單位、提示小字放大 */
.age-table th { font-size: 1rem; }
.age-table .u { font-size: 1rem; }
.gz-lab { font-size: 1rem; }
.gz-foot, .md-hint { font-size: 0.95rem; }
.gz-age .u { font-size: 1rem; }
/* 拿掉數字框右邊的上下小箭頭 */
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
/* 點生肖後捲到結果時，上方留一點空間 */
.result-area { scroll-margin-top: 12px; }
    </style>
</head>

<div class="container">
    <div class="age-head lt-row"><span class="lt-mark" aria-hidden="true">歲</span><div><p class="lt-brand">重 生 禮 儀</p><div class="lt-title">生肖・虛歲・歲次查詢</div></div></div>
    <div class="cal-toggle" id="calToggle">
        <button type="button" data-cal="lunar" class="active">農曆生日</button>
        <button type="button" data-cal="solar">國曆生日</button>
        <button type="button" data-cal="gz">歲次</button>

    <input type="number" id="yearInput" placeholder="例如：74" inputmode="numeric" autofocus>
    <div class="md-row" id="mdRow">
        <input type="number" id="monthInput" placeholder="月" inputmode="numeric" min="1" max="12">
        <input type="number" id="dayInput" placeholder="日" inputmode="numeric" min="1" max="31">
    </div>
    <div class="md-hint" id="mdHint">國曆 1、2 月出生的，請填月日（可能還沒過農曆年）</div>
    <div class="gz-pick" id="gzPick">
        <div class="gz-lab">天干</div><div class="gz-row gan" id="ganRow"></div>
        <div class="gz-lab">地支</div><div class="gz-row zhi" id="zhiRow"></div>
    </div>
    <div class="result-area" id="resultArea"></div>
    <h1 id="zodiacTitle">點選生肖回推虛歲</h1>
    <div class="zodiac-grid" id="zodiacGrid"></div>
    <div class="footer">重生禮儀製作</div>
</div>

<script>
/* 農曆過年（正月初一）換年
 *
 * 用途：沖煞歲數、生肖虛歲，一律以「農曆正月初一」換年（負責人依信發堂通書確認：
 *       民國115年2月10日 日沖肖雞 57 歲，不是 58 歲）。
 * 歲次（年柱）也以農曆正月初一換年（負責人確認：民國115年2月10日為乙巳年）。
 *
 * 下表為 1900～2100 年每年正月初一的國曆月日（MMDD），由 lunar-javascript 1.7.7 產生。
 * 不需要網路、不依賴外部函式庫；超出範圍的年份回傳 null，呼叫端要顯示「—」。
 */
(function (g) {
  var START = 1900;
  var TABLE = (
    "0131 0219 0208 0129 0216 0204 0125 0213 0202 0122" +
    "0210 0130 0218 0206 0126 0214 0203 0123 0211 0201" +
    "0220 0208 0128 0216 0205 0124 0213 0202 0123 0210" +
    "0130 0217 0206 0126 0214 0204 0124 0211 0131 0219" +
    "0208 0127 0215 0205 0125 0213 0202 0122 0210 0129" +
    "0217 0206 0127 0214 0203 0124 0212 0131 0218 0208" +
    "0128 0215 0205 0125 0213 0202 0121 0209 0130 0217" +
    "0206 0127 0215 0203 0123 0211 0131 0218 0207 0128" +
    "0216 0205 0125 0213 0202 0220 0209 0129 0217 0206" +
    "0127 0215 0204 0123 0210 0131 0219 0207 0128 0216" +
    "0205 0124 0212 0201 0122 0209 0129 0218 0207 0126" +
    "0214 0203 0123 0210 0131 0219 0208 0128 0216 0205" +
    "0125 0212 0201 0122 0210 0129 0217 0206 0126 0213" +
    "0203 0123 0211 0131 0219 0208 0128 0215 0204 0124" +
    "0212 0201 0122 0210 0130 0217 0206 0126 0214 0202" +
    "0123 0211 0201 0219 0208 0128 0215 0204 0124 0212" +
    "0202 0121 0209 0129 0217 0205 0126 0214 0203 0123" +
    "0211 0131 0219 0207 0127 0215 0205 0124 0212 0202" +
    "0122 0209 0129 0217 0206 0126 0214 0203 0124 0210" +
    "0130 0218 0207 0127 0215 0205 0125 0212 0201 0121" +
    "0209"
  ).match(/\d{4}/g);

  /* 某西元年正月初一的國曆日期 { m, d }，超出範圍回傳 null */
  function cnyDate(y) {
    var s = TABLE[y - START];
    if (!s) return null;
    return { m: parseInt(s.slice(0, 2), 10), d: parseInt(s.slice(2), 10) };
  }

  /* 國曆 y/m/d 屬於哪一個農曆年（以西元年表示）。正月初一當天起算新年。 */
  function lunarYearOf(y, m, d) {
    var c = cnyDate(y);
    if (!c) return null;
    return (m < c.m || (m === c.m && d < c.d)) ? y - 1 : y;
  }

  g.liyiCnyDate = cnyDate;
  g.liyiLunarYear = lunarYearOf;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
    // 生肖、虛歲一律以「農曆正月初一」換年：出生即 1 歲，每過一次農曆年加 1 歲
    const zodiacs = ['鼠', '牛', '虎', '兔', '龍', '蛇', '馬', '羊', '猴', '雞', '狗', '豬'];
    const today = new Date();
    const currentLunarYear = liyiLunarYear(today.getFullYear(), today.getMonth() + 1, today.getDate());
    const currentZodiacIndex = (((currentLunarYear - 1900) % 12) + 12) % 12;

    const resultArea = document.getElementById('resultArea');
    const yearInput = document.getElementById('yearInput');
    const monthInput = document.getElementById('monthInput');
    const dayInput = document.getElementById('dayInput');
    const mdRow = document.getElementById('mdRow');
    const mdHint = document.getElementById('mdHint');
    const inputTitle = document.getElementById('inputTitle');
    let calMode = 'lunar';

    function zodiacOf(year) { return zodiacs[(((year - 1900) % 12) + 12) % 12]; }

    // 歲次（干支年）：傳入農曆年（西元），1984 為甲子年；農曆年換算表範圍外顯示「—」
    const GAN = '甲乙丙丁戊己庚辛壬癸', ZHI = '子丑寅卯辰巳午未申酉戌亥';
    function suiciOf(year) {
        if (!liyiCnyDate(year)) return '—';
        const i = (((year - 1984) % 60) + 60) % 60;
        return GAN[i % 10] + ZHI[i % 12] + '年';
    }

    function showResult(zodiac, age, note, year) {
        resultArea.innerHTML = '<div class="zodiac-line"><span class="zodiac">' + zodiac + '</span>' +
            '<span class="suici">' + suiciOf(year) + '</span></div>' +
            '<div class="age-list">' + age + ' 歲（虛歲）</div>' +
            (note ? '<div class="note">' + note + '</div>' : '');
    }

    // ── 歲次查詢（看牌位「生於○○年」用）：點天干、地支，列出 360 年內所有同歲次的年份 ──
    // 年號對照：起始西元年（元年）。清朝逾年改元，不會有同一年兩個年號。
    const QING = [[1644, '順治'], [1662, '康熙'], [1723, '雍正'], [1736, '乾隆'], [1796, '嘉慶'],
                  [1821, '道光'], [1851, '咸豐'], [1862, '同治'], [1875, '光緒'], [1909, '宣統']];
    // 日本年號年中改元：1912 年明治45年／大正元年、1926 年大正15年／昭和元年。台灣日治只看 1895～1945 年。
    const JP = [[1868, '明治'], [1912, '大正'], [1926, '昭和']];
    let gzGan = null, gzZhi = null;

    function eraYear(name, n) { return name + (n === 1 ? '元年' : ' ' + n + ' 年'); }

    function qingOf(y) {
        if (y < QING[0][0] || y > 1911) return null;
        let e = QING[0];
        QING.forEach(q => { if (y >= q[0]) e = q; });
        return '清 ' + eraYear(e[1], y - e[0] + 1);
    }

    function japanOf(y) {
        if (y < 1895 || y > 1945) return null;
        const names = [];
        JP.forEach((j, k) => {
            const next = JP[k + 1];
            if (y >= j[0] && (!next || y <= next[0])) names.push(eraYear(j[1], y - j[0] + 1));
        });
        return '日治 ' + names.join('／');
    }

    function rocOf(y) { return '民國' + (y === 1912 ? '元年' : ' ' + (y - 1911) + ' 年'); }

    // 歲次模式：點好天干地支後收起按鈕，只留結果與「重選」；下方生肖按鈕在歲次模式先不顯示
    function syncGzView() {
        const gz = (calMode === 'gz'), done = gzGan !== null && gzZhi !== null;
        document.getElementById('gzPick').classList.toggle('show', gz && !done);
        inputTitle.style.display = (gz && done) ? 'none' : '';
        document.getElementById('zodiacTitle').style.display = gz ? 'none' : '';
        grid.style.display = gz ? 'none' : '';
    }

    function renderGz() {
        syncGzView();
        if (gzGan === null || gzZhi === null) { resultArea.innerHTML = ''; return; }
        // 六十甲子序號（甲子＝0）：序號除以 10 的餘數＝天干、除以 12 的餘數＝地支
        const idx = (((6 * gzGan - 5 * gzZhi) % 60) + 60) % 60;
        const latest = currentLunarYear - ((((currentLunarYear - 1984 - idx) % 60) + 60) % 60);
        const rows = [], oldRows = [];
        for (let y = latest; y > currentLunarYear - 360; y -= 60) {
            const main = y >= 1912 ? rocOf(y) : (qingOf(y) || y + ' 年');
            const sub = [y + ''];
            if (y < 1912) sub.push('民國前 ' + (1912 - y) + ' 年');
            const jp = japanOf(y);
            if (jp) sub.push(jp);
            const age = currentLunarYear - y + 1;
            // 120 歲以內先列出，更早的（都是清朝）收在「更早年份」
            (age <= 120 ? rows : oldRows).push('<li><div><div class="gz-main">' + main + '</div><div class="gz-sub">' + sub.join('・') + '</div></div>' +
                '<div class="gz-age">' + age + '<span class="u">歲</span></div></li>');
        }
        resultArea.innerHTML = '<div class="gz-head"><div class="gz-title">' + GAN[gzGan] + ZHI[gzZhi] + '年<span class="z">（肖' + zodiacs[gzZhi] + '）</span></div>' +
            '<button type="button" class="gz-redo" id="gzRedo">重選</button></div>' +
            '<ul class="gz-list">' + rows.join('') + '</ul>' +
            (oldRows.length ? '<div class="gz-old" id="gzOld"><ul class="gz-list">' + oldRows.join('') + '</ul></div>' +
                '<button type="button" class="gz-more" id="gzMore">更早年份（清朝）▾</button>' : '') +
            '<div class="gz-foot">以農曆年計；歲數為虛歲</div>';
        document.getElementById('gzRedo').onclick = () => { gzGan = gzZhi = null; drawGzButtons(); renderGz(); };
        const more = document.getElementById('gzMore');
        if (more) more.onclick = () => {
            const open = document.getElementById('gzOld').classList.toggle('show');
            more.textContent = open ? '收起較早年份 ▴' : '更早年份（清朝）▾';
        };
    }

    function drawGzButtons() {
        // 天干與地支要同為陽或同為陰才有這個歲次（例如沒有「乙子」），不成對的變灰
        document.querySelectorAll('#ganRow .gz-btn').forEach((b, i) => {
            b.classList.toggle('on', i === gzGan);
            b.disabled = gzZhi !== null && i % 2 !== gzZhi % 2;
        });
        document.querySelectorAll('#zhiRow .gz-btn').forEach((b, i) => {
            b.classList.toggle('on', i === gzZhi);
            b.disabled = gzGan !== null && i % 2 !== gzGan % 2;
        });
    }

    function makeGzButtons(rowId, chars, pick) {
        const row = document.getElementById(rowId);
        chars.split('').forEach((c, i) => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'gz-btn'; b.textContent = c;
            b.onclick = () => {
                pick(i);
                document.querySelectorAll('.zodiac-btn.on').forEach(x => x.classList.remove('on'));
                drawGzButtons(); renderGz();
            };
            row.appendChild(b);
        });
    }
    // 再點一次同一個字＝取消；換成不成對的字時，另一排的選擇清掉
    makeGzButtons('ganRow', GAN, i => { gzGan = (gzGan === i) ? null : i; if (gzGan !== null && gzZhi !== null && gzZhi % 2 !== i % 2) gzZhi = null; });
    makeGzButtons('zhiRow', ZHI, i => { gzZhi = (gzZhi === i) ? null : i; if (gzGan !== null && gzZhi !== null && gzGan % 2 !== i % 2) gzGan = null; });

    function calc() {
        // 改輸入年份時，取消生肖按鈕的反白
        document.querySelectorAll('.zodiac-btn.on').forEach(b => b.classList.remove('on'));
        if (calMode === 'gz') { renderGz(); return; }
        const roc = parseInt(yearInput.value, 10);
        if (!yearInput.value) { resultArea.innerHTML = ''; return; }
        if (isNaN(roc) || roc < 1) return;
        const western = roc + 1911;

        if (calMode === 'lunar') {
            // 農曆生日：輸入的年份就是生肖年
            if (western > currentLunarYear) { resultArea.innerHTML = '<div class="age-list">—</div>'; return; }
            showResult(zodiacOf(western), currentLunarYear - western + 1, '', western);
            return;
        }

        // 國曆生日：要看生日是否已過當年的農曆正月初一
        const m = parseInt(monthInput.value, 10), d = parseInt(dayInput.value, 10);
        const hasMD = !isNaN(m) && !isNaN(d);
        if (hasMD) {
            const dt = new Date(western, m - 1, d);
            if (m < 1 || m > 12 || dt.getMonth() !== m - 1) { resultArea.innerHTML = '<div class="age-list">日期不正確</div>'; return; }
            const birthLunarYear = liyiLunarYear(western, m, d);
            if (birthLunarYear === null || birthLunarYear > currentLunarYear) { resultArea.innerHTML = '<div class="age-list">—</div>'; return; }
            const c = liyiCnyDate(western);
            const note = birthLunarYear < western
                ? '當年 ' + c.m + '/' + c.d + ' 才過農曆年，屬前一年生肖'
                : '';
            showResult(zodiacOf(birthLunarYear), currentLunarYear - birthLunarYear + 1, note, birthLunarYear);
        } else {
            // 只填年份：以當年過年後出生計算，並提醒 1、2 月出生要填月日
            if (western > currentLunarYear) { resultArea.innerHTML = '<div class="age-list">—</div>'; return; }
            const c = liyiCnyDate(western);
            const note = c ? '若生日在國曆 ' + c.m + '/' + c.d + ' 以前，請填月日' : '';
            showResult(zodiacOf(western), currentLunarYear - western + 1, note, western);
        }
    }

    [yearInput, monthInput, dayInput].forEach(el => el.addEventListener('input', calc));

    document.getElementById('calToggle').addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        calMode = btn.dataset.cal;
        this.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
        const solar = (calMode === 'solar'), gz = (calMode === 'gz');
        mdRow.classList.toggle('show', solar);
        mdHint.classList.toggle('show', solar);
        yearInput.style.display = gz ? 'none' : '';
        inputTitle.textContent = gz ? '點選天干、地支（例如牌位上的「乙丑年」）' : solar ? '輸入國曆出生的民國年、月、日' : '輸入農曆出生的民國年';
        syncGzView();
        calc();
        if (!gz) yearInput.focus();
    });

    const grid = document.getElementById('zodiacGrid');
    zodiacs.forEach((z, index) => {
        const btn = document.createElement('div');
        btn.className = 'zodiac-btn';
        btn.innerText = z;
        btn.onclick = () => {
            let diff = (currentZodiacIndex - index + 12) % 12;
            let startAge = 1 + diff;
            let ages = [];
            for (let i = 0; i < 8; i++) { ages.push(startAge + (i * 12)); } // 縮短為顯示8組，更易讀
            // 每個虛歲列出出生那年的民國年與歲次（歲次欄只寫干支，標題已寫「歲次」）
            const rows = ages.map(a => {
                const y = currentLunarYear - a + 1;
                return '<tr><td class="c-age"><span class="n">' + a + '</span><span class="u">歲</span></td>' +
                    '<td class="c-year"><span class="u">民國</span><span class="yr">' + (y - 1911) + '</span><span class="u">年</span></td>' +
                    '<td class="c-sui"><span class="gz">' + suiciOf(y).replace('年', '') + '</span></td></tr>';
            });
            grid.querySelectorAll('.zodiac-btn').forEach(b => b.classList.toggle('on', b === btn));
            gzGan = gzZhi = null; drawGzButtons();
            resultArea.innerHTML = '<div class="zodiac-line"><span class="zodiac">' + z + '</span><span class="zodiac-cap">虛歲對照</span></div>' +
                '<table class="age-table"><thead><tr><th class="c-age">年紀</th><th class="c-year">出生年</th><th class="c-sui">歲次</th></tr></thead>' +
                '<tbody>' + rows.join('') + '</tbody></table>';
            // 結果在生肖按鈕上方，手機上點了要自動捲上去才看得到
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        grid.appendChild(btn);
    });
</script>
</body>
</html>
